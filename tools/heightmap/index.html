<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contour Generator</title>
  <meta name="description" content="Generate fake terrain and render it as subtle topographic contour lines.">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'auto'}catch(e){}</script>
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/themes.css">
  <link rel="stylesheet" href="../../assets/css/site.css">
  <script type="module" src="../../assets/js/site.js"></script>
  <script type="module" src="tool.js"></script>
  <style>
    .tool { display: grid; grid-template-columns: 20rem minmax(0, 1fr); gap: 1.5rem; align-items: start; }
    @media (max-width: 860px) { .tool { grid-template-columns: 1fr; } .tool .preview { order: -1; } }
    .panel { padding: 1rem 1.1rem; display: grid; gap: 0.25rem; }
    .panel fieldset { border: 0; padding: 0; margin: 0 0 0.75rem; display: grid; gap: 0.55rem; }
    .panel legend { font: 600 0.72rem var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.4rem; }
    .ctl { display: grid; grid-template-columns: 6.5rem 1fr 3.6rem; align-items: center; gap: 0.5rem; font: 0.85rem var(--font-sans); }
    .ctl input[type="range"] { width: 100%; accent-color: var(--accent); }
    .ctl input[type="number"], .ctl input[type="text"], .ctl select {
      width: 100%; font: 0.8rem var(--font-mono); color: var(--text); background: var(--bg-sunk);
      border: 1px solid var(--border); border-radius: 5px; padding: 0.2rem 0.3rem;
    }
    .ctl.wide { grid-template-columns: 6.5rem 1fr; }
    .ctl input[type="color"] { width: 100%; height: 1.8rem; border: 1px solid var(--border); border-radius: 5px; background: none; padding: 0; }
    .ctl input[type="checkbox"] { accent-color: var(--accent); justify-self: start; }
    .seed-row { display: grid; grid-template-columns: 6.5rem 1fr auto; gap: 0.5rem; align-items: center; font: 0.85rem var(--font-sans); }
    .seed-row input { font: 0.85rem var(--font-mono); color: var(--text); background: var(--bg-sunk); border: 1px solid var(--border); border-radius: 5px; padding: 0.3rem 0.4rem; min-width: 0; }
    .seed-row button { font: inherit; padding: 0.3rem 0.6rem; border-radius: 5px; border: 1px solid var(--border); background: var(--bg-elev); color: var(--text); cursor: pointer; }
    .preview { position: sticky; top: 5rem; }
    .preview .frame { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); background: var(--bg); }
    .preview canvas { width: 100%; height: auto; }
    .preview .status { font: 0.8rem var(--font-mono); color: var(--text-muted); margin-top: 0.5rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem; }
    .actions .button { font-size: 0.85rem; padding: 0.45rem 0.8rem; }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; translate: -50% 0; background: var(--text); color: var(--bg); padding: 0.5rem 1rem; border-radius: 6px; font: 0.9rem var(--font-sans); opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body data-backdrop="off">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>  <!-- name and menu: data/site.yml -->

  <main id="main">
    <div class="wrap">
      <p class="eyebrow">Tool</p>
      <h1>Contour generator</h1>
      <p class="lede">Make fake terrain and draw it as topographic height lines. Export SVG or PNG backdrops,
        or copy the settings into <code>assets/js/config.js</code> to use them as the site backdrop.</p>

      <div class="tool">
        <form class="card panel" data-controls onsubmit="return false"></form>

        <div class="preview">
          <div class="frame"><canvas data-preview></canvas></div>
          <div class="status"><span data-status></span><span>Settings are saved in the URL. Bookmark it to keep a look.</span></div>
          <div class="actions">
            <button class="button" type="button" data-act="svg">Download SVG</button>
            <button class="button" type="button" data-act="png">Download PNG</button>
            <button class="button ghost" type="button" data-act="config">Copy config for site</button>
            <button class="button ghost" type="button" data-act="link">Copy link</button>
            <button class="button ghost" type="button" data-act="reset">Reset</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
