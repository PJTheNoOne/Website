<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Links</title>
  <meta name="description" content="All my links in one place.">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'auto'}catch(e){}</script>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/site.js"></script>
  <script type="module" src="../assets/js/pages/tree.js"></script>
</head>
<!-- Edit the links in data/links.yml (your name is in data/site.yml) -->
<body class="tree-page" data-backdrop-seed="tree">
  <main id="main">
    <div class="wrap">
      <div class="tree">
        <img class="portrait" data-tree-portrait src="../assets/img/portrait.svg" alt="" width="104" height="104">
        <h1 data-tree-name>&nbsp;</h1>
        <p class="bio" data-tree-bio>&nbsp;</p>
        <div data-tree-sections></div>
        <div class="tree-foot muted">
          <a href="../">Home</a>
          <div data-theme-picker></div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
