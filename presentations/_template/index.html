<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deck title · COURSE</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'auto'}catch(e){}</script>
  <!--
    HOW TO USE THIS TEMPLATE
    1. Copy this folder to presentations/<course-id>/<NN-topic>/
    2. That's one folder deeper than this template, so add one "../" to the
       four asset paths below (../../assets → ../../../assets) and set
       data-home="../../" on the <main> element.
    3. Add the deck to data/presentations.json.
    See presentations/sample-course/01-welcome/ for every layout option.
  -->
  <link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../assets/css/themes.css">
  <link rel="stylesheet" href="../../assets/slides/slides.css">
  <script type="module" src="../../assets/slides/slides.js"></script>
</head>
<body>
<main class="deck" data-home="../" data-backdrop-seed="change-me">

  <section class="slide title">
    <p class="eyebrow">COURSE · Week N</p>
    <h1>Deck title</h1>
    <p class="subtitle">Subtitle</p>
    <p class="meta">Your Name · Date</p>
  </section>

  <section class="slide">
    <h2>Slide heading</h2>
    <ul>
      <li>Point one</li>
      <li class="step">Revealed on the next key press</li>
    </ul>
    <aside class="notes"><p>Speaker notes (press N).</p></aside>
  </section>

  <section class="slide center">
    <h2>Questions?</h2>
  </section>

</main>
</body>
</html>
