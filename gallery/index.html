<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'auto'}catch(e){}</script>
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/css/themes.css">
  <link rel="stylesheet" href="../assets/css/site.css">
  <script type="module" src="../assets/js/site.js"></script>
  <script type="module" src="../assets/js/pages/gallery.js"></script>
</head>
<!-- Edit the text and images in data/gallery.yml -->
<body data-backdrop-seed="gallery">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-site-header></header>  <!-- name and menu: data/site.yml -->

  <main id="main">
    <div class="wrap">
      <p class="eyebrow" data-eyebrow></p>
      <h1 data-heading></h1>
      <p class="lede" data-intro></p>
      <div class="filters" data-filters role="group" aria-label="Filter by tag"></div>
      <div class="gallery" data-gallery></div>
    </div>
  </main>

  <dialog class="lightbox" aria-label="Image viewer">
    <div class="stage"></div>
    <div class="meta"><h2></h2><p></p></div>
    <button class="lb-btn lb-close" type="button" aria-label="Close">×</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous">‹</button>
    <button class="lb-btn lb-next" type="button" aria-label="Next">›</button>
  </dialog>

  <footer class="site-footer" data-site-footer></footer>
</body>
</html>
